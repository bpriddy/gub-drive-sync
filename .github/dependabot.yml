# Watches only the shared schema package: a new @anomaly-technology/gub-schemas
# release opens an automatic bump PR. The registry token lives in the SEPARATE
# Dependabot secrets store: Settings → Secrets and variables → Dependabot →
# GH_PACKAGES_TOKEN (classic PAT, read:packages).
version: 2
registries:
  github-packages:
    type: npm-registry
    url: https://npm.pkg.github.com
    token: ${{ secrets.GH_PACKAGES_TOKEN }}
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: daily
    registries:
      - github-packages
    allow:
      - dependency-name: "@anomaly-technology/gub-schemas"
    labels:
      - schema-update
