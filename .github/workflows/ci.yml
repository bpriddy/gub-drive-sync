# CI — type check + unit tests.
#
# `npm run typecheck` is `prisma generate && tsc --noEmit`, mirroring the
# typecheck step in cloudbuild/*.yaml. Tests are the vitest suite (walker
# unit tests — hermetic, Google APIs are mocked; no DB needed).

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check (prisma generate + tsc)
        run: npm run typecheck

      - name: Unit tests (vitest)
        run: npm test
